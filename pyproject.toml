[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yanfu"
dynamic = ["version"]
description = "PDF/CAJ to Markdown translator with layout-preserving PDF generation using Ollama or OpenAI-compatible APIs"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "CodeOfMe", email = "wedonotuse@outlook.com" }
]
keywords = [
    "pdf",
    "caj",
    "markdown",
    "translation",
    "ocr",
    "document",
    "ollama",
    "openai",
    "local-llm",
    "gemma",
    "qwen",
    "layout-preservation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    # Document parsing engines
    "PyMuPDF>=1.23.0",         # Fast digital PDF parsing
    "Pillow>=9.0.0",           # Image processing
    "pdfplumber>=0.10.0",      # Table-aware PDF extraction
    "python-docx>=0.8.11",     # DOCX support
    # OCR / Layout engines
    "marker-pdf>=1.0.0",       # Best overall quality (layout + OCR + images)
    "surya-ocr>=0.6.0",        # Surya OCR backend for marker
    "docling>=2.0.0",          # IBM Docling (balanced quality/speed)
    "easyocr>=1.7.0",          # 80+ language OCR
    "numpy>=1.24.0",           # Array operations
    "doctr>=0.9.0",            # DocTR lightweight OCR
    "nougat-ocr>=0.1.0",       # Academic paper OCR
    # GPU acceleration (optional backends auto-detected)
    "torch>=2.0.0",            # PyTorch for GPU/CPU inference
    # PDF generation
    "reportlab>=4.0.0",        # PDF rendering
    "markdown>=3.4.0",         # Markdown processing
    # Model download
    "modelscope>=1.14.0",      # ModelScope for mainland China
    "platformdirs>=3.0.0",     # Cross-platform cache dirs
    # GUI
    "PySide6>=6.5.0",          # Qt GUI
    # HTTP + Utils
    "requests>=2.28.0",        # HTTP client for API calls
    "tqdm>=4.65.0",            # Progress bars
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
yanfu = "yanfu.cli:main"

[project.urls]
Homepage = "https://github.com/CodeOfMe/YanFu"
Documentation = "https://github.com/CodeOfMe/YanFu#readme"
Repository = "https://github.com/CodeOfMe/YanFu.git"
Issues = "https://github.com/CodeOfMe/YanFu/issues"
Changelog = "https://github.com/CodeOfMe/YanFu/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/yanfu/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
]

[tool.hatch.build.targets.wheel]
packages = ["src/yanfu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Briefcase configuration for MSI/DMG/AppImage packaging
# ---------------------------------------------------------------------------

[tool.briefcase]
project_name = "YanFu"
bundle = "org.codeofme"
version = "0.2.0"
url = "https://github.com/CodeOfMe/YanFu"
license = "GPL-3.0"
author = "CodeOfMe"
author_email = "wedonotuse@outlook.com"

[tool.briefcase.app.yanfu]
formal_name = "YanFu"
description = "PDF/CAJ Document Translator with Ollama/OpenAI"
long_description = """Translate PDF and CAJ documents using Ollama or OpenAI-compatible APIs.
Supports local Ollama server, OpenAI, and any OpenAI-compatible endpoint."""
icon = "src/yanfu/resources/icons/yanfu"
sources = ["src/yanfu"]
requires = [
    "PySide6>=6.5.0",
    "PyMuPDF>=1.23.0",
    "Pillow>=9.0.0",
    "pdfplumber>=0.10.0",
    "python-docx>=0.8.11",
    "reportlab>=4.0.0",
    "markdown>=3.4.0",
    "marker-pdf>=1.0.0",
    "surya-ocr>=0.6.0",
    "docling>=2.0.0",
    "easyocr>=1.7.0",
    "doctr>=0.9.0",
    "nougat-ocr>=0.1.0",
    "torch>=2.0.0",
    "modelscope>=1.14.0",
    "platformdirs>=3.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
]

# Bundle models in the installer
[tool.briefcase.app.yanfu.windows]
bundles_models = true
model_dir = "models"
installer_type = "msi"
output_format = "msi"

[tool.briefcase.app.yanfu.macOS]
bundles_models = true
model_dir = "models"
output_format = "dmg"

[tool.briefcase.app.yanfu.linux]
bundles_models = true
model_dir = "models"
output_format = "appimage"
